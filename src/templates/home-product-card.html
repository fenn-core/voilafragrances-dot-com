            <article class="product-card">
              <div class="product-card-media">
                <img src="$image_url" alt="$image_alt"
                  width="285" height="200">
                <span class="wishlist-icon" aria-hidden="true">♡</span>
              </div>
              <div class="product-card-content">
                <div>
                  <h3><a href="$product_url">$name</a></h3>
                  <p>$size</p>
                </div>
                $price
              </div>
              <button class="cart-add-button" type="button" data-cart-add="$product_id"
                aria-label="$add_label" disabled>$ui_add_short</button>
            </article>
