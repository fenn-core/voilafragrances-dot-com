      <div class="container catalog-page">
        <article class="catalog-detail">
          <nav class="catalog-breadcrumbs catalog-detail-breadcrumbs" aria-label="$ui_breadcrumb">
            <ol><li><a href="${local_root}index.html">$ui_home_title</a></li>
              <li><a href="${local_root}products/">$ui_products_title</a></li>
              <li><a href="$collection_url">$collection_name</a></li>
              <li aria-current="page">$name</li></ol>
          </nav>
          <div class="catalog-detail-media">
            <img src="$main_image_url" alt="$main_image_alt" width="570" height="400">
            $secondary_images
          </div>
          <div class="catalog-detail-content">
            <p class="eyebrow">VOILA FRAGRANCES</p>
            <h1>$name</h1>
            <p class="catalog-detail-lead">$short_description</p>
            <p class="catalog-detail-description">$description</p>
            <div class="catalog-detail-facts">
              $size
              $variants
              $price
            </div>
            <p class="catalog-demo-note">$ui_demo_product_note</p>
            <button class="button button-primary catalog-detail-add" type="button"
              data-cart-add="$product_id" aria-label="$add_label" disabled>$ui_add_detail</button>
            <p><a class="catalog-back-link" href="$collection_url">$back_label</a></p>
          </div>
        </article>
      </div>
