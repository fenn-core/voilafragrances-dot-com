      <div class="container catalog-page">
        <nav class="catalog-breadcrumbs" aria-label="İçerik yolu">

            <li><a href="${root}products/">Ürünler</a></li>
            <li><a href="$collection_url">$collection_name</a></li>
            <li aria-current="page">$name</li></ol>

        <article class="catalog-detail">
          <div class="catalog-detail-media">
            <img src="$main_image_url" alt="$main_image_alt" width="570" height="400">

            <p>$short_description</p>
            <p>$description</p>
            $size
            $variants
            $price
            <p><a href="$collection_url">$collection_name koleksiyonuna dön</a></p>
          </div>
        </article>
      </div>
