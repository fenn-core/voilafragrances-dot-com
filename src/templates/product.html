      <div class="container catalog-page">
        <article class="catalog-detail">
          <nav class="catalog-breadcrumbs catalog-detail-breadcrumbs" aria-label="İçerik yolu">
            <ol><li><a href="${root}index.html">Ana Sayfa</a></li>
              <li><a href="${root}products/">Ürünler</a></li>
              <li><a href="$collection_url">$collection_name</a></li>
              <li aria-current="page">$name</li></ol>
          </nav>
          <div class="catalog-detail-media">
            <img src="$main_image_url" alt="$main_image_alt" width="570" height="400">
            $secondary_images
          </div>
          <div class="catalog-detail-content">
            <p class="eyebrow">VOILA FRAGRANCES</p>
            <h1>$name</h1>
            <p class="catalog-detail-lead">$short_description</p>
            <p class="catalog-detail-description">$description</p>
            <div class="catalog-detail-facts">
              $size
              $variants
              $price
            </div>
            <p class="catalog-demo-note">Temsilî ürün: bilgiler, görseller ve fiyat örnek amaçlıdır.</p>
            <p><a class="catalog-back-link" href="$collection_url">$collection_name koleksiyonuna dön</a></p>
          </div>
        </article>
      </div>
